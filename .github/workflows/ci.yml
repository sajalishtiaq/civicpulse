name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-type-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: ruff check .

      - run: mypy app --ignore-missing-imports || true

  lint-and-type-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+psycopg://civicpulse:testpass@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: civicpulse
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: |
          pip install pytest-cov
          pytest --cov=app --cov-report=term-missing --cov-fail-under=0

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs:
      - lint-and-type-backend
      - lint-and-type-frontend
      - test-backend
      - test-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: civicpulse-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: civicpulse-frontend:ci

  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image for scan
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: civicpulse-backend:ci

      - name: Build frontend image for scan
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: civicpulse-frontend:ci

      - name: Scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: civicpulse-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: civicpulse-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests with kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/overlays/prod > /tmp/manifests.yaml || kubectl kustomize k8s/base > /tmp/manifests.yaml
          ./kubeconform -summary -kubernetes-version 1.29.0 -ignore-missing-schemas /tmp/manifests.yaml

  integration:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          echo "POSTGRES_USER=civicpulse" >> .env
          echo "POSTGRES_PASSWORD=testpass" >> .env
          echo "POSTGRES_DB=civicpulse" >> .env
          echo "TRIAGE_PROVIDER=simulated" >> .env
          echo "GROQ_API_KEY=unused" >> .env
          echo "GROQ_MODEL=unused" >> .env

      - name: Start services
        run: docker compose -f compose.yaml up -d --build

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend ready"
              exit 0
            fi
            echo "Waiting..."
            sleep 3
          done

          echo "Backend failed to become ready"
          docker compose -f compose.yaml ps
          docker compose -f compose.yaml logs backend
          exit 1

      - name: POST a complaint and verify it comes back
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text": "burst water main flooding street 12", "location": "Street 12"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"category"'

      - name: Check X-Cache MISS then HIT
        run: |
          curl -sD - http://localhost:8000/api/stats -o /dev/null | grep -i "x-cache: MISS"
          curl -sD - http://localhost:8000/api/stats -o /dev/null | grep -i "x-cache: HIT"

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v
