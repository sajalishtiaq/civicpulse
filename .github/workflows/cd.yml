name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.push-backend.outputs.digest }}
      frontend_digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - name: Build and push frontend
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
      - name: Generate SBOMs
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: backend-sbom.spdx.json
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: frontend-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            backend-sbom.spdx.json
            frontend-sbom.spdx.json

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
      - name: Create k3d cluster
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create ci-cluster --port "80:80@loadbalancer" --wait
      - name: Set image tags
        run: |
          cd k8s/overlays/prod
          kubectl kustomize . > /tmp/before.yaml || true
      - name: Update prod overlay with commit SHA
        run: |
          cd k8s/overlays/prod
          sed -i "s#newName: ghcr.io/.*civicpulse-backend#newName: ${{ env.BACKEND_IMAGE }}#" kustomization.yaml
          sed -i "s#newName: ghcr.io/.*civicpulse-frontend#newName: ${{ env.FRONTEND_IMAGE }}#" kustomization.yaml
          sed -i "s#newTag: .*#newTag: \"${{ github.sha }}\"#" kustomization.yaml
      - name: Deploy
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/overlays/prod
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s
      - name: Smoke test via Ingress
        run: |
          sleep 10
          curl -sf http://localhost/api/stats || (kubectl get pods -n civicpulse && kubectl logs -l app=backend -n civicpulse --tail=50 && exit 1)
      - name: Show HPA
        run: kubectl get hpa -n civicpulse